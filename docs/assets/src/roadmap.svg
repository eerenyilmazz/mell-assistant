<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
  <title id="t">Mell roadmap</title>
  <desc id="d">Nine phases. Phases 0 to 2 form v0.1: foundation, core chat, memory and first tools, followed by a quality gate. Then the desktop shell with apps and system controls on the Linux host, capabilities such as media and web plus assisted memory, voice, agents and automation, import, hardening.</desc>
  <style>
    .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; }
    .sans  { font-family: 'Instrument Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono  { font-family: 'Geist Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
    .t1 { fill: #EEEAE2; } .t2 { fill: #A39E93; } .t3 { fill: #6E6A62; } .acc { fill: #FF5A1F; }
    .h { font-size: 21px; }
    .s { font-size: 12.5px; }
  </style>
  <rect width="1280" height="300" rx="14" fill="#111110"/>
  <text x="48" y="48" class="mono t3" style="font-size:11px;letter-spacing:1.6px">DELIVERY PHASES</text>
  <text x="1232" y="48" text-anchor="end" class="mono t3" style="font-size:11px;letter-spacing:1.6px">EACH PHASE ENDS WITH A WORKING SYSTEM</text>

  <!-- track -->
  <path d="M48 120H1232" stroke="#2A2825" stroke-width="2"/>
  <path d="M48 120H424" stroke="#EEEAE2" stroke-width="2"/>
  <text x="48" y="92" class="mono t1" style="font-size:11.5px;letter-spacing:1.4px">v0.1 · USABLE CORE</text>
  <path d="M492 110L502 120L492 130L482 120Z" fill="#111110" stroke="#FF5A1F" stroke-width="1.5"/>
  <text x="492" y="92" text-anchor="middle" class="mono acc" style="font-size:11px;letter-spacing:1.2px">GATE</text>

  <!-- ticks: x positions -->
  <g fill="#EEEAE2">
    <circle cx="48" cy="120" r="5"/><circle cx="236" cy="120" r="5"/><circle cx="424" cy="120" r="5"/>
  </g>
  <g fill="#111110" stroke="#6E6A62" stroke-width="1.5">
    <circle cx="560" cy="120" r="5"/><circle cx="672" cy="120" r="5"/><circle cx="784" cy="120" r="5"/>
    <circle cx="896" cy="120" r="5"/><circle cx="1008" cy="120" r="5"/><circle cx="1120" cy="120" r="5"/>
  </g>

  <g>
    <text x="48"  y="162" class="mono t3 s">0</text><text x="48"  y="190" class="serif t1 h">Foundation</text>
    <text x="48"  y="212" class="sans t2 s">repo, auth, database,</text><text x="48" y="230" class="sans t2 s">CI, self-checks</text>

    <text x="236" y="162" class="mono t3 s">1</text><text x="236" y="190" class="serif t1 h">Core chat</text>
    <text x="236" y="212" class="sans t2 s">streaming, history,</text><text x="236" y="230" class="sans t2 s">cancel, idempotency</text>

    <text x="424" y="162" class="mono t3 s">2</text><text x="424" y="190" class="serif t1 h">Memory, tools</text>
    <text x="424" y="212" class="sans t2 s">Memory Center,</text><text x="424" y="230" class="sans t2 s">read-only tools</text>

    <text x="560" y="162" class="mono t3 s">3</text><text x="560" y="190" class="serif t2 h">Desktop</text>
    <text x="560" y="212" class="sans t3 s">Tauri on Linux,</text><text x="560" y="230" class="sans t3 s">apps, controls</text>

    <text x="672" y="162" class="mono t3 s">4</text><text x="672" y="190" class="serif t2 h">Capabilities</text>
    <text x="672" y="212" class="sans t3 s">media, web,</text><text x="672" y="230" class="sans t3 s">memory assist</text>

    <text x="784" y="162" class="mono t3 s">5</text><text x="784" y="190" class="serif t2 h">Voice</text>
    <text x="784" y="212" class="sans t3 s">push-to-talk,</text><text x="784" y="230" class="sans t3 s">1.3 s p50</text>

    <text x="896" y="162" class="mono t3 s">6</text><text x="896" y="190" class="serif t2 h">Agents</text>
    <text x="896" y="212" class="sans t3 s">automation,</text><text x="896" y="230" class="sans t3 s">external actions</text>

    <text x="1008" y="162" class="mono t3 s">7</text><text x="1008" y="190" class="serif t2 h">Import</text>
    <text x="1008" y="212" class="sans t3 s">reviewed</text><text x="1008" y="230" class="sans t3 s">pipeline</text>

    <text x="1120" y="162" class="mono t3 s">8</text><text x="1120" y="190" class="serif t2 h">Hardening</text>
    <text x="1120" y="212" class="sans t3 s">installers,</text><text x="1120" y="230" class="sans t3 s">review</text>
  </g>
  <path d="M48 262H1232" stroke="#2A2825"/>
  <text x="48" y="284" class="mono t3" style="font-size:11.5px">Nothing after Phase 2 starts before the gate passes.</text>
</svg>
