<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">MELL roadmap</title>
  <desc id="d">Nine phases. Phases 0 to 2 form v0.1: foundation, core chat, memory and first tools. A quality gate follows phase 2. Later phases: second device and desktop, assisted memory, voice, agents and automation, import, hardening.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="v01" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', 'DejaVu Sans', Arial, sans-serif; }
    .num { font-size: 15px; font-weight: 800; }
    .h   { font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .s   { font-size: 12.5px; fill: #94a3b8; }
    .zone { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #64748b; }
  </style>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <text x="40" y="44" class="zone">DELIVERY PHASES</text>

  <!-- v0.1 bracket -->
  <rect x="40" y="66" width="400" height="30" rx="15" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-opacity="0.5"/>
  <text x="240" y="86" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#93c5fd;letter-spacing:1.5px">v0.1 · USABLE CORE</text>

  <!-- track -->
  <rect x="40" y="148" width="1200" height="6" rx="3" fill="#1f2937"/>
  <rect x="40" y="148" width="400" height="6" rx="3" fill="url(#v01)"/>

  <!-- gate -->
  <g transform="translate(468 151)">
    <rect x="-13" y="-13" width="26" height="26" rx="4" transform="rotate(45)" fill="#0b0f17" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="0" y="5" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#fbbf24">G</text>
  </g>
  <text x="468" y="124" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fbbf24">quality gate</text>

  <!-- milestones: x = 70, 240, 410, 560, 650... use explicit -->
  <g>
    <circle cx="70" cy="151" r="16" fill="#0b0f17" stroke="#60a5fa" stroke-width="3"/><text x="70" y="156" text-anchor="middle" class="num" fill="#93c5fd">0</text>
    <text x="70" y="196" text-anchor="middle" class="h">Foundation</text>
    <text x="70" y="216" text-anchor="middle" class="s">repo · auth · DB</text>
    <text x="70" y="234" text-anchor="middle" class="s">CI · self-checks</text>

    <circle cx="240" cy="151" r="16" fill="#0b0f17" stroke="#60a5fa" stroke-width="3"/><text x="240" y="156" text-anchor="middle" class="num" fill="#93c5fd">1</text>
    <text x="240" y="196" text-anchor="middle" class="h">Core chat</text>
    <text x="240" y="216" text-anchor="middle" class="s">streaming · history</text>
    <text x="240" y="234" text-anchor="middle" class="s">cancel · idempotency</text>

    <circle cx="410" cy="151" r="16" fill="#0b0f17" stroke="#22d3ee" stroke-width="3"/><text x="410" y="156" text-anchor="middle" class="num" fill="#67e8f9">2</text>
    <text x="410" y="196" text-anchor="middle" class="h">Memory + tools</text>
    <text x="410" y="216" text-anchor="middle" class="s">Memory Center</text>
    <text x="410" y="234" text-anchor="middle" class="s">read-only MCP tools</text>
  </g>
  <g>
    <circle cx="560" cy="151" r="14" fill="#0b0f17" stroke="#475569" stroke-width="2.5"/><text x="560" y="156" text-anchor="middle" class="num" fill="#cbd5e1">3</text>
    <text x="560" y="196" text-anchor="middle" class="h">Second device</text>
    <text x="560" y="216" text-anchor="middle" class="s">Mac · Tauri</text>

    <circle cx="684" cy="151" r="14" fill="#0b0f17" stroke="#475569" stroke-width="2.5"/><text x="684" y="156" text-anchor="middle" class="num" fill="#cbd5e1">4</text>
    <text x="684" y="196" text-anchor="middle" class="h">Assisted</text>
    <text x="684" y="214" text-anchor="middle" class="h">memory</text>
    <text x="684" y="234" text-anchor="middle" class="s">candidates · routing</text>

    <circle cx="808" cy="151" r="14" fill="#0b0f17" stroke="#475569" stroke-width="2.5"/><text x="808" y="156" text-anchor="middle" class="num" fill="#cbd5e1">5</text>
    <text x="808" y="196" text-anchor="middle" class="h">Voice</text>
    <text x="808" y="216" text-anchor="middle" class="s">push-to-talk</text>
    <text x="808" y="234" text-anchor="middle" class="s">≤ 1.3 s P50</text>

    <circle cx="932" cy="151" r="14" fill="#0b0f17" stroke="#475569" stroke-width="2.5"/><text x="932" y="156" text-anchor="middle" class="num" fill="#cbd5e1">6</text>
    <text x="932" y="196" text-anchor="middle" class="h">Agents</text>
    <text x="932" y="216" text-anchor="middle" class="s">automation</text>
    <text x="932" y="234" text-anchor="middle" class="s">external actions</text>

    <circle cx="1056" cy="151" r="14" fill="#0b0f17" stroke="#475569" stroke-width="2.5"/><text x="1056" y="156" text-anchor="middle" class="num" fill="#cbd5e1">7</text>
    <text x="1056" y="196" text-anchor="middle" class="h">Import</text>
    <text x="1056" y="216" text-anchor="middle" class="s">reviewed pipeline</text>

    <circle cx="1180" cy="151" r="14" fill="#0b0f17" stroke="#475569" stroke-width="2.5"/><text x="1180" y="156" text-anchor="middle" class="num" fill="#cbd5e1">8</text>
    <text x="1180" y="196" text-anchor="middle" class="h">Hardening</text>
    <text x="1180" y="216" text-anchor="middle" class="s">installers · review</text>
  </g>

  <text x="640" y="290" text-anchor="middle" class="s">Each phase ends with a working system and explicit exit criteria. Nothing after Phase 2 starts before the gate passes.</text>
</svg>
