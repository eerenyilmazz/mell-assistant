<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="t d">
  <title id="t">MELL architecture</title>
  <desc id="d">Windows host runs the UI, the NestJS backend with its modules, Ollama, PostgreSQL and the host MCP server over stdio. The Mac runs a UI client and a device connector that connects outbound to the backend over a private network. A cloud model is optional, policy-filtered and spend-capped.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.03"/>
    </pattern>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', 'Helvetica Neue', 'DejaVu Sans', Arial, sans-serif; }
    .zone  { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #64748b; }
    .h     { font-size: 18px; font-weight: 700; fill: #f8fafc; }
    .s     { font-size: 14px; font-weight: 400; fill: #94a3b8; }
    .chip  { font-size: 14px; font-weight: 600; fill: #e2e8f0; }
    .lbl   { font-size: 12px; font-weight: 600; fill: #94a3b8; }
    .box   { fill: #111827; stroke: #263246; stroke-width: 1.5; }
    .core  { fill: #0f1a2e; stroke: #3b82f6; stroke-width: 2; }
  </style>

  <rect width="1280" height="690" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="690" rx="20" fill="url(#grid)"/>

  <!-- Windows host zone -->
  <rect x="30" y="30" width="800" height="580" rx="18" fill="none" stroke="#334155" stroke-dasharray="6 6"/>
  <text x="54" y="60" class="zone">WINDOWS HOST · PRIMARY</text>

  <!-- UI -->
  <rect x="60" y="85" width="230" height="78" rx="12" class="box"/>
  <text x="80" y="117" class="h">UI</text>
  <text x="80" y="142" class="s">Svelte 5 · Tauri webview</text>

  <!-- Backend -->
  <rect x="60" y="215" width="740" height="215" rx="16" class="core"/>
  <rect x="80" y="215" width="700" height="4" rx="2" fill="url(#accent)"/>
  <text x="84" y="252" class="h">Backend</text>
  <text x="170" y="252" class="s">NestJS modular monolith · TypeScript strict</text>
  <g>
    <rect x="84"  y="278" width="128" height="58" rx="10" fill="#16233b" stroke="#2d4a7a"/>
    <text x="148" y="304" text-anchor="middle" class="chip">Turn</text>
    <text x="148" y="323" text-anchor="middle" class="chip">Orchestrator</text>

    <rect x="226" y="278" width="128" height="58" rx="10" fill="#10291f" stroke="#1f6b4f"/>
    <text x="290" y="304" text-anchor="middle" class="chip">Permission</text>
    <text x="290" y="323" text-anchor="middle" class="chip">Engine</text>

    <rect x="368" y="278" width="128" height="58" rx="10" fill="#16233b" stroke="#2d4a7a"/>
    <text x="432" y="304" text-anchor="middle" class="chip">Memory</text>
    <text x="432" y="323" text-anchor="middle" class="chip">scoped · hybrid</text>

    <rect x="510" y="278" width="128" height="58" rx="10" fill="#16233b" stroke="#2d4a7a"/>
    <text x="574" y="304" text-anchor="middle" class="chip">AI ports</text>
    <text x="574" y="323" text-anchor="middle" class="chip">AI SDK</text>

    <rect x="652" y="278" width="128" height="58" rx="10" fill="#16233b" stroke="#2d4a7a"/>
    <text x="716" y="304" text-anchor="middle" class="chip">Activity log</text>
    <text x="716" y="323" text-anchor="middle" class="chip">append-only</text>
  </g>
  <text x="84" y="380" class="s">Every turn: correlation id · idempotency key · cancellable · taint-tracked</text>
  <text x="84" y="406" class="s">Model output, files and web content are data, never instructions</text>

  <!-- Bottom row -->
  <rect x="60"  y="490" width="230" height="92" rx="12" class="box"/>
  <text x="80"  y="525" class="h">Ollama</text>
  <text x="80"  y="550" class="s">local models · 127.0.0.1</text>
  <text x="80"  y="570" class="s">12 GB VRAM budget</text>

  <rect x="315" y="490" width="230" height="92" rx="12" class="box"/>
  <text x="335" y="525" class="h">PostgreSQL</text>
  <text x="335" y="550" class="s">pgvector · turkish FTS</text>
  <text x="335" y="570" class="s">127.0.0.1</text>

  <rect x="570" y="490" width="230" height="92" rx="12" class="box"/>
  <text x="590" y="525" class="h">Host MCP server</text>
  <text x="590" y="550" class="s">stdio child process</text>
  <text x="590" y="570" class="s">no listening port</text>

  <!-- Host arrows -->
  <path d="M175 163V211" stroke="#60a5fa" stroke-width="2.5" fill="none" marker-end="url(#aBlue)"/>
  <text x="186" y="194" class="lbl">HTTPS · SSE · session auth</text>
  <path d="M175 430V486" stroke="#60a5fa" stroke-width="2.5" fill="none" marker-end="url(#aBlue)"/>
  <text x="186" y="463" class="lbl">loopback</text>
  <path d="M430 430V486" stroke="#60a5fa" stroke-width="2.5" fill="none" marker-end="url(#aBlue)"/>
  <text x="441" y="463" class="lbl">loopback</text>
  <path d="M685 430V486" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#aGreen)"/>
  <text x="696" y="463" class="lbl">MCP · stdio</text>

  <!-- Mac zone -->
  <rect x="880" y="30" width="370" height="330" rx="18" fill="none" stroke="#334155" stroke-dasharray="6 6"/>
  <text x="904" y="60" class="zone">MACBOOK AIR M1</text>
  <rect x="905" y="85" width="320" height="70" rx="12" class="box"/>
  <text x="925" y="115" class="h">UI client</text>
  <text x="925" y="138" class="s">same Svelte app</text>
  <rect x="905" y="185" width="320" height="110" rx="12" class="box"/>
  <text x="925" y="215" class="h">Device connector</text>
  <text x="925" y="238" class="s">+ Mac MCP server · local allow-list</text>
  <g transform="translate(925 258)">
    <rect width="190" height="24" rx="12" fill="#10291f" stroke="#1f6b4f"/>
    <path d="M14 11v-3a5 5 0 0 1 10 0v3" fill="none" stroke="#34d399" stroke-width="1.8"/>
    <rect x="11" y="11" width="16" height="9" rx="2" fill="#34d399"/>
    <text x="36" y="17" class="lbl" fill="#34d399" style="fill:#34d399">no listening port</text>
  </g>
  <text x="905" y="330" class="lbl">Outbound, device-authenticated WebSocket</text>
  <text x="905" y="348" class="lbl">over Tailscale / WireGuard</text>

  <!-- Mac arrows into backend -->
  <path d="M905 120H848V262H804" stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-dasharray="8 6" marker-end="url(#aBlue)"/>
  <path d="M905 240H866V318H804" stroke="#34d399" stroke-width="2.5" fill="none" stroke-dasharray="8 6" marker-end="url(#aGreen)"/>

  <!-- Cloud -->
  <rect x="880" y="420" width="370" height="162" rx="18" fill="none" stroke="#334155" stroke-dasharray="6 6"/>
  <text x="904" y="450" class="zone">OPTIONAL</text>
  <rect x="905" y="470" width="320" height="92" rx="12" class="box" style="stroke:#7c5a12"/>
  <text x="925" y="505" class="h">Cloud model</text>
  <text x="925" y="530" class="s">opt-in · policy-filtered</text>
  <text x="925" y="550" class="s">sensitive data never sent · spend cap</text>
  <path d="M800 400H850V516H901" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#aAmber)"/>

  <!-- Legend -->
  <g transform="translate(60 640)">
    <path d="M0 0H44" stroke="#60a5fa" stroke-width="2.5"/>
    <text x="54" y="5" class="lbl">local / loopback</text>
    <path d="M190 0H234" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="8 6"/>
    <text x="244" y="5" class="lbl">private network</text>
    <path d="M380 0H424" stroke="#34d399" stroke-width="2.5"/>
    <text x="434" y="5" class="lbl">MCP tool calls (policy-checked)</text>
    <path d="M660 0H704" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round"/>
    <text x="714" y="5" class="lbl">external, opt-in</text>
    <text x="1160" y="5" text-anchor="end" class="lbl">Only the backend listens on the network</text>
  </g>
</svg>
