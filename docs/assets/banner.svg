<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">MELL — personal AI assistant platform</title>
  <desc id="desc">Banner with the MELL wordmark, a waveform motif and the tagline: governed memory, local-first models, permission-gated actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#151b26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1080" cy="160" r="220" fill="url(#glow)"/>

  <!-- Waveform motif -->
  <g transform="translate(950 160)" fill="url(#accent)">
    <rect x="0"   y="-14" width="10" height="28"  rx="5" opacity="0.55"/>
    <rect x="22"  y="-34" width="10" height="68"  rx="5" opacity="0.7"/>
    <rect x="44"  y="-58" width="10" height="116" rx="5" opacity="0.85"/>
    <rect x="66"  y="-82" width="10" height="164" rx="5"/>
    <rect x="88"  y="-46" width="10" height="92"  rx="5" opacity="0.9"/>
    <rect x="110" y="-96" width="10" height="192" rx="5"/>
    <rect x="132" y="-64" width="10" height="128" rx="5" opacity="0.9"/>
    <rect x="154" y="-30" width="10" height="60"  rx="5" opacity="0.8"/>
    <rect x="176" y="-72" width="10" height="144" rx="5" opacity="0.95"/>
    <rect x="198" y="-42" width="10" height="84"  rx="5" opacity="0.8"/>
    <rect x="220" y="-20" width="10" height="40"  rx="5" opacity="0.65"/>
    <rect x="242" y="-8"  width="10" height="16"  rx="5" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="96" y="168" font-size="112" font-weight="800" letter-spacing="10" fill="#f8fafc">MELL</text>
    <rect x="100" y="190" width="72" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="98" y="236" font-size="26" font-weight="500" fill="#cbd5e1">Personal AI assistant platform</text>
    <text x="98" y="272" font-size="18" font-weight="400" fill="#64748b" letter-spacing="1.5">GOVERNED MEMORY · LOCAL-FIRST MODELS · PERMISSION-GATED ACTIONS</text>
  </g>
</svg>
